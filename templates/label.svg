<text class="note" x="12" y="9.3" text-anchor="start">title (cassette.title) · baseline 9.5 mm</text>
<text class="note" x="12" y="14" text-anchor="start">side title (sides.A.title) · baseline 14 mm</text>
<text class="note" x="2.5" y="36" text-anchor="start">bottom band (stripes / gradient)</text>
<text class="note" x="86" y="38.8" text-anchor="end">type C60</text>
<text class="small" x="44.5" y="24.6" text-anchor="middle">keep-out: window + hub holes + 0.5 mm</text>
<text class="head" x="0" y="-8" text-anchor="start">oTAPE 1.0 · label_a / label_b · 89 × 42 mm · 2136 × 1008 px @ 24 px/mm (min 1068 × 504)</text>
<text class="note" x="0" y="-4.5" text-anchor="start">Green dashed = safe area (2 mm). Red = keep-out, must be transparent. Blue = lettering zones of the procedural label. Corner radius 2 mm.</text>
