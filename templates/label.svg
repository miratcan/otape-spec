<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="-14 -14 190 74">
<title>oTAPE label template</title>
<style>
  text { font-family: Helvetica, Arial, sans-serif; fill: #333; }
  .trim { fill: #fff; stroke: #111; stroke-width: 0.25; }
  .safe { fill: none; stroke: #2a9d8f; stroke-width: 0.2; stroke-dasharray: 1 0.6; }
  .keep { fill: rgba(230,57,70,0.18); stroke: #e63946; stroke-width: 0.2; }
  .zone { fill: rgba(69,123,157,0.12); stroke: #457b9d; stroke-width: 0.15; }
  .fold { stroke: #999; stroke-width: 0.2; stroke-dasharray: 2 1; }
  .dim { stroke: #666; stroke-width: 0.12; fill: none; }
  .note { font-size: 1.8px; }
  .small { font-size: 1.3px; fill: #555; }
  .head { font-size: 2.6px; font-weight: bold; }
</style>
<rect class="trim" x="0" y="0" width="89" height="42" rx="2"/>
<rect class="safe" x="2" y="2" width="85" height="38" rx="2"/>
<rect class="keep" x="24" y="17.5" width="41" height="13" rx="1.5"/>
<circle class="keep" cx="23.3" cy="24" r="9"/>
<circle class="keep" cx="65.7" cy="24" r="9"/>
<rect class="zone" x="2.5" y="3" width="6.5" height="8" rx="0"/>
<rect class="zone" x="11" y="3.5" width="75.5" height="7" rx="0"/>
<rect class="zone" x="11" y="10.5" width="75.5" height="4.5" rx="0"/>
<rect class="zone" x="0" y="33" width="89" height="9" rx="0"/>
<rect class="zone" x="70" y="35" width="16.5" height="5" rx="0"/>
